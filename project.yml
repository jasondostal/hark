name: Hark
options:
  bundleIdPrefix: dev.ducktyping
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HarkCore:
    path: HarkCore
targets:
  Hark:
    type: application
    platform: iOS
    sources:
      - path: Hark/Sources
      - path: Hark/Resources
      - path: Hark/Shared
      # Perch 2.0, fp16-safe Core ML build from ~/working/perch-spike (git-ignored, 196 MB). Xcode compiles it to Perch.mlmodelc.
      - path: Models/Perch.mlpackage
      # BirdNET+ Geomodel V3.0.4 (Apache 2.0), from tools/convert_geomodel.py (git-ignored, 15 MB).
      - path: Models/Geo.mlpackage
      # BirdNET+ V3.0 Global 12K (Apache 2.0), from tools/convert_birdnet3.py (git-ignored).
      - path: Models/BirdNET3.mlpackage
    dependencies:
      - package: HarkCore
      - target: HarkWidgets
    # App Group: shares "today" data with the widgets (needs the Xcode account signed in to provision).
    entitlements:
      path: Hark/Hark.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.ducktyping.hark]
    info:
      path: Hark/Info.plist
      properties:
        CFBundleDisplayName: Hark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Hark listens through the microphone to identify birds, frogs, insects and mammals. Audio is analyzed on this device and never leaves it.
        NSLocationWhenInUseUsageDescription: Hark tags each sound it identifies with where you heard it, and checks IDs against the species found there at this time of year. Your location stays on this iPhone.
        UILaunchScreen: {}
        UIAppFonts: [Silkscreen-Regular.ttf]
        CFBundleURLTypes:
          - CFBundleURLName: dev.ducktyping.hark
            CFBundleURLSchemes: [hark]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ducktyping.hark
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8N87FTKWXL
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        COREML_CODEGEN_LANGUAGE: None
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) HARK_APP"
  HarkWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HarkWidgets
      - path: Hark/Shared
    entitlements:
      path: HarkWidgets/HarkWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.ducktyping.hark]
    info:
      path: HarkWidgets/Info.plist
      properties:
        CFBundleDisplayName: Hark
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ducktyping.hark.widgets
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8N87FTKWXL
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
